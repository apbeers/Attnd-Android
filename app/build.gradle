plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

// Firebase Cloud Messaging needs app/google-services.json (not committed). Without it the app
// still builds and runs; push is simply unavailable (FirebaseApp is never initialised).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace = 'com.arcu.attnd'
    // The assistant eval's runner and grader (unit tests: router mode; androidTest: model mode on a phone),
    // with the catalogue and DEMO bundle from src/test/resources.
    sourceSets {
        test { kotlin.srcDir 'src/evalShared/java' }
        androidTest {
            kotlin.srcDir 'src/evalShared/java'
            resources.srcDirs += 'src/test/resources'
        }
    }
    // Android 17 QPR2 (platform 37.2, the newest stable SDK in Nov 2026).
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = "com.arcu.attnd"
        minSdk = 33
        targetSdk = 37
        // Only the opt-in assistant eval in model mode (androidTest/AssistantEvalModelTest, a phone with Gemini Nano).
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        def versionPropsFile = rootProject.file('version.properties')
        def versionProps = new Properties()
        if (versionPropsFile.exists()) {
            versionProps.load(new FileInputStream(versionPropsFile))
        }
        // CI passes VERSION_CODE (always increasing); local builds use version.properties.
        def code = (System.getenv("VERSION_CODE") ?: versionProps['VERSION_CODE'])?.toString()?.toInteger() ?: 1

        versionCode = code
        versionName = System.getenv("VERSION_NAME") ?: "1.0.$code"

        Properties localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }

        def attndKey = localProperties.getProperty("ATTND_API_KEY") ?: System.getenv("ATTND_API_KEY") ?: ""
        def mapsKey = localProperties.getProperty("MAPS_API_KEY") ?: System.getenv("MAPS_API_KEY") ?: ""
        // API host without scheme; CI sets dev.attnd.app (or similar) for develop builds. Without one, store
        // builds use production and local debug builds the dev server (below): production accepts only Play
        // Integrity, which a debug build on an emulator can never pass.
        def serverOverride = System.getenv("ATTND_SERVER") ?: localProperties.getProperty("ATTND_SERVER")
        project.ext.attndServerOverride = serverOverride
        def server = serverOverride ?: "attnd.app"
        buildConfigField "String", "ATTND_SERVER", "\"$server\""

        buildConfigField "String", "ATTND_API_KEY", "\"$attndKey\""
        buildConfigField "String", "MAPS_API_KEY", "\"$mapsKey\""

        manifestPlaceholders = [MAPS_API_KEY: mapsKey]

        // Logging spec §2–4: dev builds (and local debug builds) log at debug level and show the log
        // viewer; dev builds also upload their logs continuously; release builds keep errors on the device
        // unless the user turns on debug mode.
        buildConfigField "boolean", "DEV", "false"
        // Whether this build may upload logs (dev builds always, release builds in a debug session).
        // Local debug builds never upload (iOS: Xcode builds never upload); they keep logcat, the ring
        // buffer and the log viewer.
        buildConfigField "boolean", "UPLOAD_LOGS", "true"
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file("signing.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile = rootProject.file(props.getProperty("STORE_FILE"))
                storePassword = props.getProperty("STORE_PASSWORD")
                keyAlias = props.getProperty("KEY_ALIAS")
                keyPassword = props.getProperty("KEY_PASSWORD")

                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            // -PstoreScreenshots (store-screenshots.yml): the package and upload-key signature of the real
            // app, which the restricted Maps key accepts, so the store screenshots show map tiles. Still a
            // debug build (screenshot mode, dev server); it is only installed on the CI emulator.
            if (project.hasProperty("storeScreenshots")) {
                if (!rootProject.file("signing.properties").exists()) {
                    throw new GradleException("-PstoreScreenshots needs signing.properties (the upload key)")
                }
                signingConfig = signingConfigs.getByName("release")
            } else {
                applicationIdSuffix ".debug"
            }
            versionNameSuffix "-debug"
            buildConfigField "String", "ATTND_SERVER", "\"${project.ext.attndServerOverride ?: 'dev.attnd.app'}\""
            buildConfigField "boolean", "DEV", "true"
            buildConfigField "boolean", "UPLOAD_LOGS", "false"
        }
        release {
            signingConfig = signingConfigs.getByName("release")
            // Store builds authenticate with Play Integrity only; never ship the static key.
            buildConfigField "String", "ATTND_API_KEY", "\"\""

            // R8: CI uploads build/outputs/mapping/release/mapping.txt to Play (deobfuscationfiles) and
            // attnd-web (POST /api/diagnostics/symbols/) so crash stacks can be retraced.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // develop → Play internal testing (logging spec §4): the release build (upload-key signed, Play
        // Integrity, no static key, package com.arcu.attnd so Play and google-services accept it) with
        // readable code: no R8, so stack traces need no mapping. Not debuggable: Play rejects debuggable
        // bundles on every track. BuildConfig.DEV turns on debug logging, uploads and the log viewer.
        dev {
            initWith release
            minifyEnabled = false
            shrinkResources = false
            debuggable = false
            matchingFallbacks = ['release']
            buildConfigField "boolean", "DEV", "true"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    androidResources {
        // English only: drop the libraries' translations (replaces defaultConfig.resConfigs).
        localeFilters += ['en']
    }
    lint {
        // Machine-readable report next to the HTML/SARIF ones; CI prints and annotates its warnings
        // (scripts/ci/lint_summary.py) without failing the build.
        xmlReport = true
        // minSdk 33: a call or constant newer than Android 13 must sit behind a version check (fails the build).
        error += ['NewApi', 'InlinedApi']
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // Prebuilt native libraries from AndroidX / ML Kit / CameraX AARs. They are published
            // already stripped (`file` reports "stripped"), so AGP has nothing to remove; without this
            // it tries anyway and logs "Unable to strip the following libraries" when the runner has
            // no matching NDK. We build no native code ourselves. Add new ones here if that message
            // comes back after a dependency update.
            keepDebugSymbols += [
                    '**/libandroidx.graphics.path.so',     // androidx.graphics:graphics-path (Compose)
                    '**/libbarhopper_v3.so',               // ML Kit barcode scanning
                    '**/libdatastore_shared_counter.so',   // androidx.datastore
                    '**/libimage_processing_util_jni.so',  // CameraX
                    '**/libsurface_util_jni.so',           // CameraX
            ]
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

// Live API integration tests (src/test/.../integration, against ATTND_IT_SERVER with ATTND_IT_KEY) run
// only with -PintegrationTests, and then only they run:
//   ATTND_IT_SERVER=… ATTND_IT_KEY=… ./gradlew testDebugUnitTest -PintegrationTests
// A plain `./gradlew test` (CI's unit-test run) never includes them. The test JVM inherits the Gradle
// process's environment at execution time (also with the configuration cache), so the two variables
// reach the tests without being stored in the build; the tests skip themselves when either is unset.
def integrationTests = providers.gradleProperty('integrationTests').isPresent()
def assistantEval = providers.gradleProperty('assistantEval').isPresent()
tasks.withType(Test).configureEach { test ->
    if (integrationTests) {
        test.filter.includeTestsMatching 'com.arcu.attnd.integration.*'
        // Results depend on a live server, not on inputs Gradle can see: never up to date or from the cache.
        test.outputs.upToDateWhen { false }
        test.outputs.cacheIf { false }
    } else {
        test.exclude 'com/arcu/attnd/integration/**'
    }
    // The full assistant eval (unit/AssistantEvalTest.routerEval) only with -PassistantEval; it writes a report,
    // so it is never up to date or from the cache. The catalogue and critical questions run in every unit run.
    if (assistantEval) {
        test.systemProperty 'attnd.assistantEval', 'router'
        test.testLogging.showStandardStreams = true
        test.outputs.upToDateWhen { false }
        test.outputs.cacheIf { false }
    }
}

// Dependency policy: Kotlin/kotlinx, AndroidX/Jetpack and the Google first-party SDKs the app
// needs. No other third-party libraries (networking is HttpURLConnection, JSON is
// kotlinx.serialization, images use a small in-house loader).
dependencies {
    // AndroidX core / lifecycle
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    // Compose + Material3 (+ adaptive layouts for foldables), all from the BOM: Compose UI / foundation,
    // Material3 1.5.0 (Material 3 Expressive: MaterialExpressiveTheme, MotionScheme.expressive, search bars,
    // ShortNavigationBar / WideNavigationRail in NavigationSuiteScaffold, floating toolbars, button groups,
    // loading indicators), the adaptive navigation suite and material3-adaptive.
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.compose.material3.navigation.suite
    implementation libs.compose.material3.adaptive
    implementation libs.compose.material3.adaptive.layout
    implementation libs.compose.material3.adaptive.navigation
    implementation libs.androidx.window.core

    // Kotlin
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlinx.coroutines.play.services

    // Google Maps (googlemaps first-party: maps-compose + its clustering utils)
    implementation libs.maps.compose
    implementation libs.maps.compose.utils
    implementation libs.play.services.maps
    implementation libs.play.services.location

    // Play Integrity (API attestation) and Play Install Referrer (QR → Play Store deep link)
    implementation libs.play.integrity
    implementation libs.installreferrer

    // Block Store: the device id survives a reinstall on this phone (not backed up to the cloud).
    implementation libs.play.services.auth.blockstore

    // "Ask about this event": Gemini Nano on the device via ML Kit GenAI Prompt API (beta; runtime
    // availability check, falls back to plain search).
    implementation libs.mlkit.genai.prompt

    // Push (FCM)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    // QR scanning
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.mlkit.barcode.scanning

    testImplementation libs.junit
    // The assistant eval's model mode on a phone (opt-in, never in CI): AndroidX Test only.
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    testImplementation libs.kotlinx.coroutines.test
    debugImplementation libs.compose.ui.tooling
}

name: Android CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit & integration tests
        env:
          ATTND_API_KEY: ${{ secrets.ATTND_API_KEY }}
        run: ./gradlew test -PATTND_API_KEY="$ATTND_API_KEY" --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 14

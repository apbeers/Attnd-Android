# Android pipeline
#   every run         → "Unit tests & lint" (debug unit tests + lint; pull requests also assemble the debug
#                       app), and in parallel "Integration · dev" / "Integration · prod": the live API tests
#                       (src/test/.../integration) against each server. The integration jobs never gate
#                       delivery; prod may fail without failing the run (continue-on-error).
#   push to develop   → also, in parallel: "Signed bundle" (release .aab, kept as an artifact); then
#                       "Publish to Play" (Linux, needs the tests and the bundle) → internal testing (dev server).
#   push to main      → the same → Play production (rollout set by PLAY_ROLLOUT), together with the store
#                       listing text from store/en-US (same Play edit). Screenshots are separate and manual:
#                       store-screenshots.yml; text-only updates: store-text.yml.
# Gradle caches (~/.gradle/caches incl. the build cache, and the wrapper) are kept between runs per job and
# saved by every push (pull requests only read them).
# Docs-only commits don't run; a newer push to develop cancels the older run (main never cancels).
#
# Setup: see SETUP.md in attnd-web. Uses only GitHub's own actions + Google's APIs.
name: Android

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'scripts/ci/screenshots.sh', 'scripts/ci/compose_screenshots.py',
                   'store/en-US/captions.txt', '.github/workflows/store-*.yml']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATTND_SERVER: ${{ vars.ATTND_SERVER || 'dev.attnd.app' }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-
            gradle-test-
      - name: Accept Android SDK licenses
        # `yes` reports "Broken pipe" when sdkmanager exits before reading all of it; that is expected.
        run: yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      # Live API tests are the separate "Integration" jobs; this run excludes them (see app/build.gradle).
      # On pushes the "Signed bundle" job proves the app builds, so only pull requests assemble it here.
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug ${{ github.event_name == 'pull_request' && 'assembleDebug' || '' }}
      - name: Lint warnings
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/lint_summary.py app/build/reports/lint-results-debug.xml
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove Firebase config
        if: always()
        run: rm -f app/google-services.json
      - name: Save Gradle caches
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.sha }}

  bundle:
    name: Signed bundle
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      # Higher than every version code uploaded before CI existed (last manual build: 224).
      VERSION_CODE: ${{ github.run_number }}000
      VERSION_NAME: 2.0.${{ github.run_number }}
      ATTND_SERVER: ${{ vars.ATTND_SERVER || 'attnd.app' }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-bundle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-bundle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-
            gradle-bundle-
      - name: Accept Android SDK licenses
        # `yes` reports "Broken pipe" when sdkmanager exits before reading all of it; that is expected.
        run: yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Signing and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing.properties
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Signed bundle
        id: bundle
        run: ./gradlew bundleRelease
      - name: Remove signing material
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/upload.jks" app/google-services.json
      - name: Keep bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Save Gradle caches
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-bundle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.sha }}

  publish:
    name: ${{ github.ref == 'refs/heads/main' && 'Publish to Play production' || 'Publish to Play internal testing' }}
    needs: [test, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci
            store
      - uses: actions/download-artifact@v7
        with:
          name: android-bundle
          path: bundle
      - name: Publish to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ github.ref == 'refs/heads/main' && 'production' || 'internal' }}
          ROLLOUT: ${{ github.ref == 'refs/heads/main' && (vars.PLAY_ROLLOUT || '1.0') || '1.0' }}
          # The RELEASE_NOTES repo variable overrides store/en-US/release_notes.txt.
          NOTES: ${{ vars.RELEASE_NOTES || '' }}
          # Production releases also publish the listing text (it is shared by every track, so never on develop).
          LISTING: ${{ github.ref == 'refs/heads/main' && 'store/en-US' || '' }}
        run: |
          python3 -m pip install --quiet "pyjwt[crypto]"
          python3 scripts/ci/play_publish.py bundle/app-release.aab \
            --track "$TRACK" --rollout "$ROLLOUT" --notes "$NOTES" --notes-file store/en-US/release_notes.txt \
            ${LISTING:+--listing "$LISTING"}

  integration:
    # Live API tests through the app's real client (HttpClient → AttndApi → ApiMapper), pure JVM, against
    # the DEMO event. Separate from the unit tests above so a server problem never blocks a release: no job
    # depends on these. Prod uses a CI key the server accepts only for DEMO; until it is set there, that job
    # fails as a warning (continue-on-error) and the run stays green.
    name: Integration · ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.target == 'prod' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dev
            server: dev.attnd.app
            key: ATTND_API_KEY        # the dev server's static key
          - target: prod
            server: attnd.app
            key: ATTND_PROD_CI_KEY    # accepted by production for the DEMO event only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Gradle caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-integration-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-integration-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-
            gradle-integration-
      - name: Accept Android SDK licenses
        # `yes` reports "Broken pipe" when sdkmanager exits before reading all of it; that is expected.
        run: yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Live API tests (${{ matrix.server }})
        env:
          ATTND_IT_SERVER: ${{ matrix.server }}
          # Each job only ever sees its own server's key (never the dev key on prod).
          ATTND_IT_KEY: ${{ secrets[matrix.key] }}
        run: |
          if [ -z "$ATTND_IT_KEY" ]; then
            echo "::warning title=Integration · ${{ matrix.target }}::Secret ${{ matrix.key }} is not set; the live tests are skipped."
          fi
          ./gradlew testDebugUnitTest -PintegrationTests
      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci/junit_summary.py --title "Integration · ${{ matrix.target }} (${{ matrix.server }})" \
            ${{ matrix.target == 'prod' && '--warn' || '' }} app/build/test-results/testDebugUnitTest
      - name: Prod failures don't fail the run
        if: ${{ failure() && matrix.target == 'prod' }}
        run: |
          echo "Integration · prod failed; reported as a warning only (continue-on-error). Expected until production serves the CI key." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Integration · prod::Live tests against attnd.app failed (not blocking)."
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.target }}-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Gradle caches
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.target == 'dev' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-integration-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.sha }}

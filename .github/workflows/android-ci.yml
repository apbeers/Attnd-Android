name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt into Node.js 24 for actions to fix deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Create local.properties
      env:
        MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        ATTND_KEY: ${{ secrets.ATTND_API_KEY }}
      run: |
        echo "MAPS_API_KEY=${MAPS_KEY:-AIzaSyD5d9fk5-uONbun8VkOGHDIRGcJ_Pvqczc}" >> local.properties
        echo "ATTND_API_KEY=${ATTND_KEY:-ce23b0d41e71285582fb42cebf48d416b4161c12f9b29825a99f9a4b34368ade}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Upload Build Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: '**/build/reports/'

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk

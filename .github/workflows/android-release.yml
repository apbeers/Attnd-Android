name: Android Release

# This workflow builds a signed release AAB and uploads it to the Google Play Internal track.
# It runs only when manually triggered from the Actions tab.

on:
  workflow_dispatch:

env:
  # Opt into Node.js 24 for actions to fix deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
          ATTND_KEY: ${{ secrets.ATTND_API_KEY }}
        run: |
          echo "MAPS_API_KEY=$MAPS_KEY" >> local.properties
          echo "ATTND_API_KEY=$ATTND_KEY" >> local.properties

      # ── Signing setup ────────────────────────────────────────────────────────

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Write signing.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > signing.properties << EOF
          STORE_FILE=keystore.jks
          STORE_PASSWORD=${STORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon

      # ── Upload ───────────────────────────────────────────────────────────────

      - name: Upload to Google Play (Internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arcu.attnd
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Remove sensitive files
        if: always()
        run: rm -f keystore.jks signing.properties local.properties

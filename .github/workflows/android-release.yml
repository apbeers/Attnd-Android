name: Android Release

# Runs only when a commit lands on main (via merged PR).
# Tests are already required to pass before merging, so this job skips them.
# Builds a signed release AAB and uploads it to Google Play internal track.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Build & Upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Signing setup ────────────────────────────────────────────────────────

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Write signing.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > signing.properties << EOF
          STORE_FILE=keystore.jks
          STORE_PASSWORD=${STORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build release AAB
        env:
          ATTND_API_KEY: ${{ secrets.ATTND_API_KEY }}
        run: |
          ./gradlew bundleRelease \
            -PATTND_API_KEY="$ATTND_API_KEY" \
            --no-daemon

      # ── Upload ───────────────────────────────────────────────────────────────

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arcu.attnd
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Remove keystore
        if: always()
        run: rm -f keystore.jks signing.properties
